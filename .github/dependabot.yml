version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "pytest*"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      aws-cdk:
        patterns:
          - "aws-cdk-lib"
          - "constructs"
          - "cdk-nag"
        update-types:
          - "minor"
          - "patch"
    # cdk-nag 3.x replaces its Aspect-based API with an experimental
    # PolicyValidationPlugin model (Validations.of(app).add_plugins(...) /
    # .acknowledge(...)) -- not a drop-in bump. pyproject.toml already caps it
    # below 3.0; this stops Dependabot from re-proposing the same major-version PR
    # every week regardless. Revisit once cdk-nag 3.x stabilizes (see PR #11).
    ignore:
      - dependency-name: "cdk-nag"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci-cd"
