name: CI

# Runs on every pull request, including from forks, and on every push to main (direct
# pushes are this project's current workflow -- see PROJECT_PLAN.md -- so this is what
# actually validates main itself, not just PRs against it; a CI status badge tied only
# to pull_request would reflect whatever PR last happened to run, not main's real state).
# Deliberately has no `id-token` permission and requests no AWS credentials anywhere in
# this file (ADR-026) — a fork PR gets byte-for-byte the same checks as a same-repo PR,
# with zero ability to reach AWS or repository secrets, and the added push trigger can't
# weaken that: a fork can never push to this repository's main branch in the first place.
# Deployment lives entirely in deploy.yml, also triggered by a push to main, but with
# every job requesting id-token: write -- kept in a separate file regardless (ADR-026),
# since that's what makes "this file has no AWS credential path" a fact about the file
# itself, not something that happens to be true of its current trigger set.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,infra]"
      - run: ruff check .
      - run: black --check .
      - run: mypy .

  test:
    name: Unit + contract tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  test-infra:
    name: CDK assertion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -e ".[dev,infra]"
      - run: pytest -m infra -q

  iac-security-scan:
    name: IaC security scan (cdk-nag + cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -e ".[dev,infra]"
      - run: npm install -g aws-cdk
      - name: cdk-nag (AwsSolutionsChecks) — fails on any un-suppressed Error finding
        working-directory: infrastructure
        env:
          CDK_NAG_ENABLED: "true"
        run: |
          cdk synth -c env=dev --quiet
          cdk synth -c env=prod --quiet
      - name: cfn-lint against the synthesized templates
        run: |
          pip install "cfn-lint>=1.0,<2.0"
          # W3005 ignored everywhere: CDK itself adds a belt-and-suspenders DependsOn
          # between a Lambda function and its role's policy that's already implied by
          # the Fn::GetAtt reference — a benign, CDK-generated artifact, not a template
          # defect. E3030 ignored for GitHubOidc only: CDK's iam.OpenIdConnectProvider
          # L2 construct auto-generates a custom-resource Lambda pinned to a Node.js
          # runtime newer than cfn-lint's bundled resource spec currently recognizes —
          # a cfn-lint schema-currency gap in a CDK-internal resource this project's
          # code doesn't configure, not a real template defect. W3037 ignored for
          # ModelRouter only: cfn-lint's bundled IAM action list recognizes
          # bedrock:InvokeModel/InvokeModelWithResponseStream but not the newer
          # bedrock:Converse/ConverseStream (added Phase 3/Phase 10c) — both are real,
          # documented Bedrock Runtime actions, verified against AWS's own IAM
          # reference, not a typo in this project's policy; another schema-currency gap.
          cfn-lint --ignore-checks W3005 W3037 --template infrastructure/cdk.out/ModelRouter-dev.template.json
          cfn-lint --ignore-checks W3005 W3037 --template infrastructure/cdk.out/ModelRouter-prod.template.json
          cfn-lint --ignore-checks W3005 E3030 --template infrastructure/cdk.out/GitHubOidc.template.json

  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,infra]"
      - run: pip install pip-audit
      # --skip-editable: this project's own editable install has no PyPI entry to
      # check against, not a real finding to ignore.
      #
      # --ignore-vuln: dev-only tooling advisories with no fix available inside this
      # project's current major-version pin (black<25, pytest<9) — neither package is
      # bundled into the deployed Lambda or ever exposed to untrusted input, so these
      # are a supply-chain/dev-environment tracking item, not a runtime risk. Revisit
      # (remove the ignore, bump the pin) the next time Dependabot proposes black/
      # pytest updates (see .github/dependabot.yml) — do not let this list grow stale.
      - run: |
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-2120 \
            --ignore-vuln PYSEC-2026-2121 \
            --ignore-vuln PYSEC-2026-1845

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action calls `GET /repos/{owner}/{repo}/pulls/{n}/commits` to determine
    # the diff range for a pull_request-triggered scan -- read-only, but a scope the
    # workflow-level `contents: read` permission (line 14) doesn't cover. Scoped to just
    # this job rather than raised workflow-wide, since no other job needs it. Dependabot
    # PRs get a read-only-by-default GITHUB_TOKEN, but respect explicit `permissions:`
    # declared in the workflow (GitHub Actions changelog, 2021-10-06) -- this is not a
    # write grant, so it doesn't weaken the fork/Dependabot isolation ADR-026 describes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
