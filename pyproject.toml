[project]
name = "aws-model-router"
version = "0.1.0"
description = "A serverless, policy-driven model routing platform for Amazon Bedrock and other model providers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Artur Lapczynski" }]
keywords = [
    "aws",
    "bedrock",
    "llm",
    "model-routing",
    "serverless",
    "platform-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Runtime dependencies for the domain/application/adapter layers (src/) — this is what
# actually ships inside the Lambda deployment package (infrastructure/bundling.py), so
# it's kept minimal. CDK (infrastructure/) and dev-only tooling are separate extras
# groups below, never bundled into the Lambda package.
dependencies = [
    "boto3>=1.34.116,<2.0",
    "openai>=1.30,<3.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
    "black>=24.3,<27.0",
    "mypy>=1.9,<2.0",
    "pre-commit>=3.7,<5.0",
    "boto3-stubs[bedrock-runtime,dynamodb,events,secretsmanager,ssm]>=1.34,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "moto[dynamodb]>=5.0,<6.0",
]
infra = [
    "aws-cdk-lib>=2.150,<3.0",
    "constructs>=10.3,<11.0",
    # Capped below 3.0 deliberately: v3 replaces the Aspect-based API
    # (Aspects.of(app).add(...), NagSuppressions.add_resource_suppressions(...))
    # with an experimental PolicyValidationPlugin model
    # (Validations.of(app).add_plugins(...) / Validations.of(construct).acknowledge(...),
    # every relevant method marked `:stability: experimental`) -- not a drop-in
    # version bump. Revisit once cdk-nag 3.x stabilizes out of experimental status
    # (see PR #11, closed rather than migrated to an unstable API).
    "cdk-nag>=2.35,<3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "infrastructure"]
extend-exclude = ["infrastructure/cdk.out"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (forbid naive datetimes)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length is enforced by black/ruff formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "adapters", "handlers", "shared"]

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# mypy (types)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "infrastructure"]
files = ["src", "tests", "infrastructure"]
exclude = ["infrastructure/cdk\\.out/", "infrastructure/\\.cdk\\.staging/"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m \"not infra\""
markers = [
    "unit: fast, isolated unit tests with no I/O",
    "integration: tests exercising multiple in-process components together",
    "contract: tests validating request/response and provider contracts",
    "infra: CDK template-assertion tests; excluded by default (real asset bundling, ~30-60s) — run explicitly with `pytest -m infra`",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
